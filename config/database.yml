# PostgreSQL configuration for high-performance concurrent operations.
# Solid Queue, Solid Cache, and Solid Cable use separate logical databases.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 15 } %>  # Increased for concurrency
  timeout: 5000

  # PostgreSQL performance optimizations
  variables:
    statement_timeout: 30000
    lock_timeout: 10000
    idle_in_transaction_session_timeout: 60000

development:
  primary: &primary_development
    <<: *default
    database: nua_messaging_development
    username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
    password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
    host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
    port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  queue:
    <<: *primary_development
    database: nua_messaging_development_queue
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
  cache:
    <<: *primary_development
    database: nua_messaging_development_cache
    migrations_paths: db/cache_migrate
    schema_dump: cache_schema.rb
  cable:
    <<: *primary_development
    database: nua_messaging_development_cable
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb
  solid_observer_queue:
    adapter: sqlite3
    pool: 5
    timeout: 5000
    database: storage/development_solid_observer_queue.sqlite3
    migrations_paths: db/solid_observer_migrate

